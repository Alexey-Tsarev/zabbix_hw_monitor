# Hardware sensors support: low-level discovery for temperatures, fans, volts.
#
# Values are served by the built-in Zabbix agent 2 "sensor" plugin:
# sensor[<chip>,<feature>]
#
# Example:
# sensor[coretemp-isa-0000,temp1]
#
# hwmon.value[*] tries sensor plugin first, falls back to sysfs if unsupported.
#
# This file must be included from zabbix_agent2.conf, e.g.:
# Include=/etc/zabbix/zabbix_agent2.d/*.conf
UserParameter=hwmon.discovery,/etc/zabbix/scripts/hwmon_discovery.sh
UserParameter=hwmon.value[*],/etc/zabbix/scripts/hwmon_value.sh $1 $2
